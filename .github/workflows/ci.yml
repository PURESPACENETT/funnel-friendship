name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Validate Supabase Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check quote webhook syntax
        run: deno check supabase/functions/quote-request-webhook/index.ts
