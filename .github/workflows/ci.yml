name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check published application
        run: |
          set -e
          status=$(curl -L -sS -o /tmp/purespacenett.html -w "%{http_code}" --max-time 30 https://id-preview--26b9f4d5-20ac-40f1-abaf-4e43b025acc6.lovable.app/)
          test "$status" = "200"
          test -s /tmp/purespacenett.html
