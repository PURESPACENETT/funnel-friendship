name: Live E2E validation

on:
  push:

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Submit production quote test
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL="e2e-${GITHUB_RUN_ID}@purespacenett.invalid"
          RESPONSE_FILE="$RUNNER_TEMP/e2e-response.json"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" --max-time 30 \
            -X POST "https://purespacenett.com/api/public/devis" \
            -F "fullName=E2E Validation PURE SPACE NETT" \
            -F "clientType=entreprise" \
            -F "companyName=E2E Validation PURE SPACE NETT" \
            -F "email=$TEST_EMAIL" \
            -F "phone=0102030405" \
            -F "address=1 rue Test" \
            -F "city=Paris" \
            -F "postalCode=75001" \
            -F "propertyType=Bureau" \
            -F "surface=25" \
            -F "serviceType=Nettoyage de bureaux et locaux professionnels" \
            -F "frequency=Une seule fois" \
            -F "desiredDate=2030-01-01" \
            -F "message=Validation E2E automatique — ne pas traiter" \
            -F "consent=true" \
            -F "company=" \
            -F "landing_page=https://purespacenett.com/devis" )"
          echo "HTTP=$HTTP_CODE"
          cat "$RESPONSE_FILE"
          test "$HTTP_CODE" = "200"
          grep -q '"ok":true' "$RESPONSE_FILE"
